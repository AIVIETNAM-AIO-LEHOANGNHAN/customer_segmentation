[pytest]
# Bộ test của nhóm đặt tên theo mã Task (T10_1_test_*.py, T10.2_test_*.py) nên
# KHÔNG khớp mẫu mặc định của pytest (test_*.py, *_test.py) — hệ quả là
# `pytest tests/` âm thầm bỏ qua chúng và báo "no tests collected".
#
# Riêng tên có dấu chấm (T10.2_test_scaling.py) còn không import được ở chế độ
# mặc định vì "T10.2_test_scaling" không phải định danh Python hợp lệ:
#     ModuleNotFoundError: No module named 'T10'
# --import-mode=importlib nạp theo đường dẫn file nên xử lý được.
#
# Ghi nhận bởi QA/QC trong Task 10.2 (KAN — Kiểm thử Task 8).

testpaths = tests
python_files = test_*.py *_test.py T10*_test_*.py
addopts = --import-mode=importlib
